<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Zozo</title>
<meta name="theme-color" content="#120E2E">
<meta property="og:title" content="For Zozo">
<meta property="og:description" content="A small thing to wake up to.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,100,1;1,9..144,300..600,100,1&family=Karla:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:   #120E2E;
    --dusk:    #3B2A5E;
    --ember:   #B4527A;
    --apricot: #F2A15E;
    --glow:    #FFE7CD;
    --whisper: rgba(255,231,205,.6);
    --faint:   rgba(255,231,205,.55);

    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --body: "Karla", "Avenir Next", system-ui, sans-serif;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ min-height:100%; }

  body{
    background: var(--night);
    color: var(--glow);
    font-family: var(--body);
    min-height:100svh;
    display:grid;
    place-items:center;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    -webkit-font-smoothing:antialiased;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }

  canvas#sky{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- the dawn ---- */
  .horizon{
    position:fixed;
    inset:auto 0 -30svh 0;
    height:110svh;
    background:
      radial-gradient(55svh 45svh at 50% 100%, var(--apricot) 0%, rgba(242,161,94,0) 62%),
      radial-gradient(95svh 70svh at 50% 100%, var(--ember) 0%, rgba(180,82,122,0) 68%),
      radial-gradient(150svh 105svh at 50% 100%, var(--dusk) 0%, rgba(59,42,94,0) 75%);
    transform: translateY(35svh);
    opacity:0;
    animation: rise 7s cubic-bezier(.22,.61,.36,1) .3s forwards,
               breathe 9s ease-in-out 7.5s infinite;
    pointer-events:none;
  }
  @keyframes rise{ to{ transform: translateY(0); opacity:1; } }
  @keyframes breathe{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.12); } }

  /* soft grain so the gradient doesn't band */
  .grain{
    position:fixed; inset:-50%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
    opacity:.07; mix-blend-mode:overlay; pointer-events:none;
  }

  /* ---- the words ---- */
  main{
    position:relative;
    z-index:2;
    text-align:center;
    padding-block: 3rem 5rem;
    max-width: 24ch;
  }

  h1{
    font-family: var(--display);
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 96;
    font-weight:380;
    font-size: clamp(1.9rem, 7.4vw, 3.4rem);
    line-height:1.14;
    letter-spacing:-0.018em;
    text-wrap:balance;
    text-shadow: 0 0 40px rgba(242,161,94,.18);
  }

  .sorry{
    font-style: italic;
    font-weight: 460;
    position: relative;
  }
  .scrawl{
    position:absolute; left:-4%; bottom:-.18em; width:108%; height:.42em;
    overflow:visible; pointer-events:none;
  }
  .scrawl path{
    fill:none; stroke: var(--apricot); stroke-width:2.4; stroke-linecap:round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: write 1.4s cubic-bezier(.6,.05,.3,1) 2.2s forwards;
    opacity:.85;
  }
  @keyframes write{ to{ stroke-dashoffset:0; } }

  .nono{ font-style: italic; color: var(--apricot); }
  .promise{ display:inline-block; }

  .line-two{
    display:block;
    margin-top: 1.1em;
    font-size: .5em;
    font-weight:300;
    font-style:italic;
    line-height:1.4;
    letter-spacing:.01em;
    color: var(--whisper);
    text-shadow:none;
  }

  .w{
    display:inline-block;
    opacity:0;
    transform: translateY(.45em);
    filter: blur(8px);
    animation: surface 1.8s cubic-bezier(.16,.84,.44,1) forwards;
    animation-delay: calc(1s + var(--i) * .32s);
  }
  @keyframes surface{ to{ opacity:1; transform:none; filter:blur(0); } }

  .sign{
    margin-top: 2.6rem;
    display:flex; flex-direction:column; align-items:center; gap:.8rem;
    font-family: var(--display);
    font-style:italic;
    font-weight:300;
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    letter-spacing:.02em;
    color: var(--faint);
    opacity:0;
    animation: surface 2s ease 5.8s forwards;
  }

  .heart{
    width:22px; height:22px;
    color: var(--ember);
    filter: drop-shadow(0 0 10px rgba(180,82,122,.6));
    animation: beat 2.4s ease-in-out 8s infinite;
  }
  @keyframes beat{
    0%,60%,100%{ transform:scale(1); }
    10%{ transform:scale(1.18); }
    20%{ transform:scale(1); }
    30%{ transform:scale(1.12); }
  }

  .hint{
    position:fixed; left:0; right:0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    text-align:center;
    font-size:.7rem; letter-spacing:.22em; text-transform:lowercase;
    color: rgba(255,231,205,.3);
    opacity:0;
    animation: surface 2s ease 9s forwards;
    z-index:1;
    pointer-events:none;
  }
  .hint.gone{ display:none; }

  .float-heart{
    position:fixed; z-index:3; pointer-events:none;
    width:18px; height:18px;
    animation: lift 2.6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes lift{
    0%  { transform: translate(-50%,-50%) scale(.4); opacity:0; }
    15% { opacity:.95; }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% - 160px)) scale(1.1) rotate(var(--rot)); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .horizon{ animation:none; transform:none; opacity:1; }
    .w, .sign, .hint{ animation:none; opacity:1; transform:none; filter:none; }
    .scrawl path{ animation:none; stroke-dashoffset:0; }
    .heart{ animation:none; }
  }
</style>
</head>
<body>

  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="horizon" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <h1>
      <span class="w" style="--i:0">I'm <span class="sorry">Sorry<svg class="scrawl" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 22 3, 40 11, 60 6 S 90 4, 98 7"/></svg></span> I</span>
      <span class="w" style="--i:1">Wasn't Attentive</span>
      <span class="w" style="--i:2">Enough</span>
      <span class="w" style="--i:3">Today</span>
      <span class="w nono" style="--i:4">Ya Nono.</span>
      <span class="promise">
        <span class="w" style="--i:6">I'll do</span>
        <span class="w" style="--i:7">Better.</span>
      </span>
      <span class="line-two">
        <span class="w" style="--i:9">Hope</span>
        <span class="w" style="--i:10">You</span>
        <span class="w" style="--i:11">Slept</span>
        <span class="w" style="--i:12">Well</span>
      </span>
    </h1>
    <div class="sign">
      <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
      <p>Love, Zeyad Bassiounk</p>
    </div>
  </main>

  <div class="hint" id="hint">tap anywhere</div>

<script>
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- stars that fade as the dawn rises, plus slow rising motes ---- */
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  let W, H, dpr, stars = [], motes = [];
  function newMote(anywhere){
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + 10,
             r: 1 + Math.random() * 1.4, v: 8 + Math.random() * 14,
             sway: Math.random() * Math.PI * 2 };
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.round(W * H / 5200)}, () => ({
      x: Math.random() * W, y: Math.random() * H * .75,
      r: Math.random() * 1.1 + .25, p: Math.random() * Math.PI * 2,
      s: .4 + Math.random() * 1.2
    }));
    motes = Array.from({length: 16}, () => newMote(true));
  }
  const t0 = performance.now();
  function frame(now){
    const t = (now - t0) / 1000;
    const dawn = reduce ? 1 : Math.min(1, Math.max(0, (t - 1) / 7));
    ctx.clearRect(0,0,W,H);
    for (const s of stars){
      const tw = .55 + .45 * Math.sin(t * s.s + s.p);
      const fade = 1 - dawn * (1 - s.y / H) * .35 - dawn * (s.y / H) * .9;
      ctx.globalAlpha = Math.max(0, tw * fade * .85);
      ctx.fillStyle = '#FFE7CD';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce){
      for (let i = 0; i < motes.length; i++){
        const m = motes[i];
        m.y -= m.v / 60;
        const x = m.x + Math.sin(t * .5 + m.sway) * 14;
        ctx.globalAlpha = Math.max(0, Math.min(.6, (m.y / H) * .9)) * dawn;
        ctx.fillStyle = '#FFD3A8';
        ctx.beginPath(); ctx.arc(x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
        if (m.y < -10) motes[i] = newMote(false);
      }
      requestAnimationFrame(frame);
    }
    ctx.globalAlpha = 1;
  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);

  /* ---- tap anywhere: a few small hearts float up ---- */
  const heartSVG = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
  const colors = ['#F2A15E', '#B4527A', '#FFE7CD'];
  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', e => {
    hint.classList.add('gone');
    const n = reduce ? 1 : 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++){
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.innerHTML = heartSVG;
      h.style.left = e.clientX + 'px';
      h.style.top = e.clientY + 'px';
      h.style.color = colors[i % colors.length];
      const s = 12 + Math.random() * 14;
      h.style.width = h.style.height = s + 'px';
      h.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
      h.style.setProperty('--rot', (Math.random() * 40 - 20).toFixed(0) + 'deg');
      h.style.animationDelay = (i * .08) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 3200);
    }
  });
</script>
</body>
</html>
